services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_pets
      POSTGRES_USER: ai_pets
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_pets -d ai_pets"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
